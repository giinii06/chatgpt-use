[package]
name = "chatgpt-use"
version = "0.0.12"
edition = "2021"
description = "Turn your ChatGPT web subscription into a coding-agent backend — no API key, no Codex billing. Built on chrome-use."
license = "MIT"
repository = "https://github.com/giinii06/chatgpt-use"

[[bin]]
name = "chatgpt-use"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
walkdir = "2"
# `ask --attach` zips a directory before uploading it. Deflate via flate2's
# pure-Rust zlib-rs backend: the `deflate` umbrella also pulls zopfli, and the
# rest of the crate's default features are archive formats ChatGPT cannot open.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# JSON Schema validation for `ask --output-schema`. No default features: those
# pull an HTTP client (reqwest + a TLS stack) only to fetch remote $refs, which
# a caller's schema must not need.
jsonschema = { version = "0.55", default-features = false }

# SIGTERM/SIGINT → graceful cancel for `ask --request-id` (stop the reply,
# confirm it). Only the flag API is used, so no default features.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[profile.release]
strip = true
lto = "thin"
